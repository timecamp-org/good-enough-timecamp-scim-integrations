# Example values file for TimeCamp SCIM Integration
# Copy this file and customize for your environment

image:
  repository: your-region-docker.pkg.dev/your-project-id/your-repository/scim-integration
  tag: "latest"

serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: "scim-sa@your-project-id.iam.gserviceaccount.com"

externalSecrets:
  secretStore:
    projectID: "your-project-id"
    auth:
      workloadIdentity:
        clusterLocation: your-region
        clusterName: your-cluster-name

# S3-compatible storage (MinIO)
s3:
  enabled: true
  endpointUrl: "http://s3.example.local:9000"
  region: "your-region"
  bucketName: "scim-data"
  pathPrefix: ""
  forcePathStyle: true

# Configuration for TimeCamp
config:
  timecamp:
    domain: "app.timecamp.com"
    rootGroupId: "00000"  # Your root group ID
    ignoredUserIds: "1,2,3"  # User IDs to ignore
    showExternalId: true
    sslVerify: false
    useSupervisorGroups: false
    useDepartmentGroups: true
    prepareTransformConfig: ""  # Optional: JSON string or path to transform config
    disableNewUsers: false  # Set to true to prevent new user creation
    disableUserDeactivation: false  # Set to true to avoid disabling users
    disableGroupUpdates: false
    disableRoleUpdates: false
    disableGroupsCreation: false
    updateEmailOnExternalId: false  # Set to true to update email when matched by external ID
    replaceEmailDomain: ""
    disabledUsersGroupId: 0  # Set a TimeCamp group ID to move disabled users there
    syncPersistentSettings: false

  # Configure based on your HR system
  bamboohr:
    subdomain: "company"
    excludedDepartments: "Operations,Back Office"  # Departments to exclude

  hibob:
    serviceUserId: "service-user-id"
    excludeFilter: ""
    excludedDepartments: "Operations,Back Office"  # Departments to exclude
    supervisorRule: "work.isManager:true"
    customFields: ""

  netsuite:
    accountId: "123456_SB1"
    clientId: "your-oauth2-client-id"
    certificateId: "your-certificate-id"
    employeeQuery: ""  # Empty uses standard employee fields
    groupQuery: ""  # Empty uses the department hierarchy
    pageSize: 1000
    timeoutSeconds: 30
    sslVerify: true
    allowEmptyResult: false
    jwtAlgorithm: "PS256"
  
  azure:
    tenantId: "your-tenant-id"
    clientId: "your-client-id"
    filterGroups: "Group1,Group2"  # Groups to include
    supervisorGroups: "Managers,Team Leads"  # Optional: members get TimeCamp supervisor role
    additionalEmailSource: ""  # Optional: mail or userPrincipalName

  okta:
    orgUrl: "https://company.okta.com"
    filterGroups: "TimeCamp Users"  # Optional: exact Okta group names to include
    filterGroupIds: "00gabc123,00gdef456"  # Optional: Okta group IDs; combined with filterGroups
    supervisorGroups: "TimeCamp Supervisors"  # Optional: members get TimeCamp supervisor role
    externalIdField: "employeeNumber"  # Okta field stored as the TimeCamp external ID
    supervisorIdField: "managerId"  # Okta profile field containing manager user ID/login
    supervisorMatchField: "email"  # Manager field whose value is referenced by managerId
    supervisorRule: ""  # Optional: profile field rule, e.g. "timecampSupervisor:yes"
  
  ldap:
    host: "ldap.company.local"
    domain: "company.local"
    dn: "CN=Users,DC=company,DC=local"
    username: "ldap-reader"
    emailDomain: "company.local"
    useSamaccountname: false
    useSamaccountnameOnly: false
    useOuStructure: false
    useOuDescription: false
    useRealEmailAsEmail: false
    useWindowsLoginEmail: false
    useSsl: false
    useStartTls: false
    sslVerify: true
    supervisorGroupName: ""
    globalAdminGroupName: ""
  
  factorial:
    leaveTypeMap: '{"vacation": "Vacation", "sick": "Sick Leave"}'

# Enable the jobs you need
jobs:
  # Enable ONE fetch job based on your HR system
  fetchBamboohr:
    enabled: true
    schedule: "0 */6 * * *"  # Every 6 hours

  # fetchHibob:
  #   enabled: true
  #   schedule: "0 */6 * * *"

  # fetchNetsuite:
  #   enabled: true
  #   schedule: "0 */6 * * *"
  
  # fetchAzuread:
  #   enabled: true
  #   schedule: "0 */6 * * *"

  # fetchOkta:
  #   enabled: true
  #   schedule: "0 */6 * * *"
  
  # fetchLdap:
  #   enabled: true
  #   schedule: "0 */6 * * *"
  
  # fetchFactorial:
  #   enabled: true
  #   schedule: "0 */6 * * *"
  
  prepareTimecamp:
    enabled: true
    schedule: "30 */6 * * *"  # 30 minutes after fetch
  
  syncUsers:
    enabled: true
    schedule: "0 1,7,13,19 * * *"  # 4 times a day
  
  # Enable if using FactorialHR for time-off sync
  # syncTimeOff:
  #   enabled: true
  #   schedule: "0 8 * * *"  # Daily at 8 AM
