# Default values for timecamp-scim.
replicaCount: 1

image:
  repository: your-region-docker.pkg.dev/your-project-id/your-repository/scim-integration
  pullPolicy: IfNotPresent
  tag: ""  # Overrides the image tag whose default is the chart appVersion.

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# External Secrets Operator configuration
externalSecrets:
  enabled: true
  # Google Secret Manager backend configuration
  secretStore:
    projectID: "your-project-id"
    # If using Workload Identity
    auth:
      workloadIdentity:
        clusterLocation: your-region
        clusterName: your-cluster-name
        serviceAccountRef:
          name: scim  # K8s service account created by this chart

# S3-compatible storage configuration (MinIO, AWS S3, etc.)
s3:
  # Enable S3 storage instead of local var/ folder
  enabled: true
  # S3 endpoint URL (for MinIO or other S3-compatible services)
  endpointUrl: "http://s3.example.local:9000"
  # S3 region
  region: "your-region"
  # Bucket name for storing intermediate files
  bucketName: "scim-data"
  # Path prefix within bucket (optional)
  pathPrefix: ""
  # Force path-style addressing (required for MinIO)
  forcePathStyle: true

# Job configurations - mirrors docker-compose services
jobs:
  # Fetch jobs run on schedule
  fetchBamboohr:
    enabled: false
    schedule: "0 */6 * * *"  # Every 6 hours
    command: ["python", "fetch_bamboohr.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

  fetchHibob:
    enabled: false
    schedule: "0 */6 * * *"
    command: ["python", "fetch_hibob.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

  fetchNetsuite:
    enabled: false
    schedule: "0 */6 * * *"
    command: ["python", "fetch_netsuite.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    
  fetchAzuread:
    enabled: false
    schedule: "0 */6 * * *"
    command: ["python", "fetch_azuread.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

  fetchOkta:
    enabled: false
    schedule: "0 */6 * * *"
    command: ["python", "fetch_okta.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    
  fetchLdap:
    enabled: false
    schedule: "0 */6 * * *"
    command: ["python", "fetch_ldap.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    
  fetchFactorial:
    enabled: false
    schedule: "0 */6 * * *"
    command: ["python", "fetch_factorialhr.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
  
  # Prepare job runs after fetch
  prepareTimecamp:
    enabled: false
    schedule: "30 */6 * * *"  # 30 minutes after fetch
    command: ["python", "prepare_timecamp_json_from_fetch.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
  
  # Sync jobs
  syncUsers:
    enabled: false
    schedule: "0 */6 * * *"  # Every 6 hours
    command: ["python", "timecamp_sync_users.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    
  syncTimeOff:
    enabled: false
    schedule: "0 8 * * *"  # Daily at 8 AM
    command: ["python", "timecamp_sync_time_off.py"]
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

  # Utility jobs - run manually
  displayTree:
    enabled: false
    command: ["python", "scripts/display_timecamp_tree.py", "--file", "var/timecamp_users.json"]
    
  removeEmptyGroups:
    enabled: false
    command: ["python", "scripts/remove_empty_groups.py"]

# Configuration values - non-sensitive settings
config:
  # TimeCamp Configuration
  timecamp:
    domain: "app.timecamp.com"
    rootGroupId: ""  # Optional: specific root group ID
    ignoredUserIds: ""  # Comma-separated list of user IDs to ignore
    showExternalId: true
    skipDepartments: ""
    useSupervisorGroups: false
    useDepartmentGroups: true
    disableNewUsers: false
    disableExternalIdSync: false
    disableAdditionalEmailSync: false
    updateEmailOnExternalId: false
    disableManualUserUpdates: false
    disableUserDeactivation: false
    disableGroupUpdates: false
    disableRoleUpdates: false
    disableGroupsCreation: false
    useJobTitleNameUsers: false
    useJobTitleNameGroups: false
    replaceEmailDomain: ""  # Optional: replace email domain (e.g., "@test-timecamp.com")
    excludeRegex: ""  # Optional: Regex to exclude users (e.g., 'department="Other"')
    changeGroupsRegex: ""  # Optional: Regex to transform group paths (e.g. 'pattern|||replacement')
    prepareTransformConfig: ""  # Optional: JSON string or path to transform config
    removeEmptyGroups: false  # Remove empty groups (no users, no non-empty subgroups) after sync
    sslVerify: false
    useIsSupervisorRole: false  # Use is_supervisor boolean field to determine supervisor role
    disabledUsersGroupId: 0  # Optional: move disabled users to this TimeCamp group ID; 0 disables it
    syncPersistentSettings: false  # Persist selected TimeCamp settings between sync runs
  
  # BambooHR Configuration
  bamboohr:
    subdomain: ""  # Your BambooHR subdomain
    excludeFilter: ""
    excludedDepartments: ""  # Comma-separated list
    supervisorRule: ""  # Rule for determining supervisors (e.g., "contains:Manager")

  # HiBob Configuration
  hibob:
    serviceUserId: ""  # HiBob service user ID
    excludeFilter: ""  # HiBob people/search filter JSON
    excludedDepartments: ""  # Comma-separated list
    supervisorRule: ""  # Rule for determining supervisors (e.g., "work.isManager:true")
    customFields: ""  # Comma-separated list of additional HiBob field paths

  # NetSuite SuiteTalk REST / OAuth 2.0 client credentials configuration
  netsuite:
    accountId: ""
    clientId: ""
    certificateId: ""
    privateKeyPath: ""  # Prefer NETSUITE_PRIVATE_KEY from the Kubernetes Secret
    baseUrl: ""  # Optional account-specific API URL override
    employeeQuery: ""  # Empty uses the standard employee query
    groupQuery: ""  # Empty uses the standard department hierarchy query
    pageSize: 1000
    timeoutSeconds: 30
    sslVerify: true
    allowEmptyResult: false
    jwtAlgorithm: "PS256"
  
  # Azure AD Configuration
  azure:
    tenantId: ""
    clientId: ""
    scimEndpoint: "https://graph.microsoft.com/v1.0"
    filterGroups: ""  # Comma-separated list of groups
    supervisorGroups: ""  # Comma-separated list of groups whose members become TimeCamp supervisors
    preferRealEmail: false
    additionalEmailSource: ""  # Optional Azure field for TimeCamp additional_email: mail or userPrincipalName
    tokenExpiresAt: ""
    refreshTokenExpiresAt: ""

  # Okta Configuration
  okta:
    orgUrl: ""  # Your Okta org URL, e.g. https://company.okta.com
    userStatuses: "ACTIVE"  # Comma-separated Okta statuses to fetch
    filterGroups: ""  # Comma-separated list of exact Okta group names to include
    filterGroupIds: ""  # Comma-separated Okta group IDs to include; combined with filterGroups
    supervisorGroups: ""  # Comma-separated list of exact Okta group names whose members become TimeCamp supervisors
    excludedDepartments: ""  # Comma-separated list
    externalIdField: "id"  # Okta profile field used as TimeCamp external ID
    emailField: "email"
    nameField: "displayName"
    departmentField: "department"
    jobTitleField: "title"
    supervisorIdField: "managerId"
    supervisorMatchField: ""  # Manager field compared with supervisorIdField; defaults to externalIdField
    supervisorRule: ""  # Rule for is_supervisor, e.g. "timecampSupervisor:yes"
  
  # LDAP Configuration
  ldap:
    host: ""
    port: 389
    domain: ""
    dn: ""  # Base DN for LDAP queries
    username: ""  # LDAP bind username
    filter: "(objectClass=user)"
    emailDomain: ""
    pageSize: 1000
    useSamaccountname: false
    useSamaccountnameOnly: false
    useOuStructure: false
    useOuDescription: false
    useRealEmailAsEmail: false
    useWindowsLoginEmail: false
    useSsl: false
    useStartTls: false
    sslVerify: true
    supervisorGroupName: ""
    globalAdminGroupName: ""
  
  # FactorialHR Configuration
  factorial:
    apiUrl: "https://api.factorialhr.com/api/v1"
    leaveTypeMap: "{}"  # JSON string mapping leave types

# Raw environment variables for system settings only. Use config.* above for
# integration settings. This must be a YAML map, never KEY=value lines.
env:
  PYTHONUNBUFFERED: "1"
  DISABLE_FILE_LOGGING: "true"
